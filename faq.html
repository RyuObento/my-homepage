<section class="faq-section">
    <h2>よくあるご質問</h2>
    <div class="faq-item">
        <button class="faq-question">
            <span class="text">どんな動画を制作できますか？</span>
            <span class="faq-arrow">▼</span>
        </button>
        <div class="faq-answer">
            YouTube動画・ショート動画・MV・ゲーム実況の編集など、エンタメ系の動画制作全般に対応しています。まずはお気軽にご相談ください。
        </div>
    </div>
    <div class="faq-item">
        <button class="faq-question">
            <span class="text">納期はどのくらいかかりますか？</span>
            <span class="faq-arrow">▼</span>
        </button>
        <div class="faq-answer">
            内容によって異なりますが、通常の動画編集であれば3〜5営業日が目安です。急ぎの案件もご相談ください。
        </div>
    </div>
    <div class="faq-item">
        <button class="faq-question">
            <span class="text">料金はどのくらいですか？</span>
            <span class="faq-arrow">▼</span>
        </button>
        <div class="faq-answer">
            動画の尺・内容・クオリティによって異なります。まずは無料でお見積もりをお出しするので、お気軽にお問い合わせください。
        </div>
    </div>
    <div class="faq-item">
        <button class="faq-question">
            <span class="text">修正は何回まで対応していただけますか？</span>
            <span class="faq-arrow">▼</span>
        </button>
        <div class="faq-answer">
            基本的に2回まで無料で修正対応しています。それ以上の修正については別途ご相談させていただきます。
        </div>
    </div>
    <div class="faq-item">
        <button class="faq-question">
            <span class="text">どうやって依頼すればいいですか？</span>
            <span class="faq-arrow">▼</span>
        </button>
        <div class="faq-answer">
            お問い合わせフォームまたはSNSのDMからご連絡ください。内容をヒアリングした上で、お見積もりをご提示します。
        </div>
    </div>
</section>
